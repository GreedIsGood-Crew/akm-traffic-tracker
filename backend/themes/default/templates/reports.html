{% raw %}
<script type="text/x-template" id="reports-template">
    <v-container fluid>
        <h2>Reports</h2>

        <!-- Summary Cards -->
        <v-row dense class="mt-4">
            <v-col cols="12" sm="6" md="2" v-for="metric in summaryMetrics" :key="metric.title">
                <v-card class="pa-3" :color="metric.color">
                    <v-card-text class="text-center">
                        <div class="text-subtitle-1">{{ metric.title }}</div>
                        <div class="text-h5 font-weight-bold mt-1">{{ metric.value }}</div>
                    </v-card-text>
                </v-card>
            </v-col>
        </v-row>

        <!-- Filters Row -->
        <v-row dense class="mt-4" align="center">
            <v-col cols="12" md="2">
                <v-select
                    v-model="groupBy"
                    :items="groupByOptions"
                    label="Group By"
                    outlined
                    dense
                ></v-select>
            </v-col>
            <v-col cols="12" md="3">
                <v-menu
                    v-model="dateMenu"
                    :close-on-content-click="false"
                    :nudge-right="40"
                    transition="scale-transition"
                    offset-y
                    min-width="auto"
                >
                    <template v-slot:activator="{ on, attrs }">
                        <v-text-field
                            v-model="dateRangeText"
                            label="Date Range"
                            prepend-icon="mdi-calendar"
                            readonly
                            v-bind="attrs"
                            v-on="on"
                            outlined
                            dense
                        ></v-text-field>
                    </template>
                    <v-date-picker
                        v-model="dateRange"
                        range
                        @change="dateMenu = false"
                    ></v-date-picker>
                </v-menu>
            </v-col>
            <v-col cols="12" md="2">
                <v-btn color="primary" @click="loadAggregatedReport" block>
                    <v-icon left>mdi-magnify</v-icon>
                    Apply Filters
                </v-btn>
            </v-col>
            <v-col cols="12" md="2">
                <v-btn color="success" @click="exportCSV" block outlined>
                    <v-icon left>mdi-download</v-icon>
                    Export CSV
                </v-btn>
            </v-col>
            <v-col cols="12" md="2">
                <v-btn color="info" @click="showConversions = !showConversions" block outlined>
                    <v-icon left>mdi-swap-horizontal</v-icon>
                    {{ showConversions ? 'Show Report' : 'Show Conversions' }}
                </v-btn>
            </v-col>
        </v-row>

        <!-- Aggregated Report Table -->
        <v-row dense class="mt-4" v-if="!showConversions">
            <v-col>
                <v-card>
                    <v-card-title>
                        Aggregated Report by {{ groupByLabel }}
                    </v-card-title>
                    <v-data-table
                        :headers="aggregatedHeaders"
                        :items="aggregatedData"
                        :items-per-page="25"
                        :loading="loading"
                        class="elevation-1"
                    >
                        <template v-slot:item.clicks="{ item }">
                            {{ item.clicks.toLocaleString() }}
                        </template>
                        <template v-slot:item.unique_clicks="{ item }">
                            {{ item.unique_clicks.toLocaleString() }}
                        </template>
                        <template v-slot:item.conversions="{ item }">
                            {{ item.conversions.toLocaleString() }}
                        </template>
                        <template v-slot:item.revenue="{ item }">
                            <span class="green--text">${{ item.revenue.toFixed(2) }}</span>
                        </template>
                        <template v-slot:item.cost="{ item }">
                            <span class="red--text">${{ item.cost.toFixed(2) }}</span>
                        </template>
                        <template v-slot:item.profit="{ item }">
                            <span :class="item.profit >= 0 ? 'green--text' : 'red--text'">
                                ${{ item.profit.toFixed(2) }}
                            </span>
                        </template>
                        <template v-slot:item.roi="{ item }">
                            <span :class="item.roi >= 0 ? 'green--text' : 'red--text'">
                                {{ item.roi.toFixed(1) }}%
                            </span>
                        </template>
                        <template v-slot:item.cr="{ item }">
                            {{ item.cr.toFixed(2) }}%
                        </template>
                    </v-data-table>
                </v-card>
            </v-col>
        </v-row>

        <!-- Conversions Table (original) -->
        <v-row dense class="mt-4" v-if="showConversions">
            <v-col>
                <v-card>
                    <v-card-title>
                        Conversions
                        <v-spacer></v-spacer>
                        <v-btn color="success" small @click="reloadReports" outlined>
                            <v-icon left small>mdi-refresh</v-icon>
                            Reload
                        </v-btn>
                    </v-card-title>
                    <v-data-table
                        :headers="conversionHeaders"
                        :items="conversions"
                        :items-per-page="10"
                        class="elevation-1"
                    ></v-data-table>
                </v-card>
            </v-col>
        </v-row>
    </v-container>
</script>

<script type="application/javascript">
    Vue.component('reports-component', {
        template: '#reports-template',
        data() {
            return {
                loading: false,
                showConversions: false,
                dateMenu: false,
                groupBy: 'campaign',
                groupByOptions: [
                    { text: 'Campaign', value: 'campaign' },
                    { text: 'Offer', value: 'offer' },
                    { text: 'Source', value: 'source' },
                    { text: 'Country', value: 'country' },
                    { text: 'Date', value: 'date' }
                ],
                dateRange: [
                    new Date(new Date().setDate(new Date().getDate() - 30)).toISOString().split('T')[0],
                    new Date().toISOString().split('T')[0]
                ],
                summaryMetrics: [
                    { title: 'Clicks', value: 0, color: 'blue darken-2' },
                    { title: 'Conversions', value: 0, color: 'deep-purple darken-2' },
                    { title: 'Revenue', value: '$0', color: 'green darken-2' },
                    { title: 'Cost', value: '$0', color: 'red darken-2' },
                    { title: 'Profit', value: '$0', color: 'teal darken-2' },
                    { title: 'ROI', value: '0%', color: 'orange darken-2' }
                ],
                aggregatedHeaders: [
                    { text: 'Name', value: 'name' },
                    { text: 'Clicks', value: 'clicks' },
                    { text: 'Unique', value: 'unique_clicks' },
                    { text: 'Conv', value: 'conversions' },
                    { text: 'Revenue', value: 'revenue' },
                    { text: 'Cost', value: 'cost' },
                    { text: 'Profit', value: 'profit' },
                    { text: 'ROI %', value: 'roi' },
                    { text: 'CR %', value: 'cr' }
                ],
                aggregatedData: [],
                conversionHeaders: [
                    { text: 'Received At', value: 'received_at' },
                    { text: 'Click ID', value: 'click_id' },
                    { text: 'Campaign ID', value: 'campaign_id' },
                    { text: 'Offer ID', value: 'offer_id' },
                    { text: 'Status', value: 'status' },
                    { text: 'Sub ID 1', value: 'sub_id_1' },
                    { text: 'IP', value: 'ip' },
                    { text: 'Payout', value: 'payout' },
                    { text: 'Profit', value: 'profit' },
                    { text: 'Revenue', value: 'revenue' }
                ],
                conversions: []
            }
        },
        computed: {
            dateRangeText() {
                return this.dateRange.join(' ~ ');
            },
            groupByLabel() {
                const option = this.groupByOptions.find(o => o.value === this.groupBy);
                return option ? option.text : 'Campaign';
            }
        },
        mounted() {
            this.loadAggregatedReport();
            this.loadReports();
            this.$root.$on('load-reports', this.loadAggregatedReport);
        },
        methods: {
            loadSummary() {
                const dateFrom = this.dateRange[0];
                const dateTo = this.dateRange[1];
                fetch(`/backend/api/reports/summary?date_from=${dateFrom}&date_to=${dateTo}`)
                    .then(res => res.json())
                    .then(data => {
                        this.summaryMetrics = [
                            { title: 'Clicks', value: data.clicks.toLocaleString(), color: 'blue darken-2' },
                            { title: 'Conversions', value: data.conversions.toLocaleString(), color: 'deep-purple darken-2' },
                            { title: 'Revenue', value: `$${data.revenue.toFixed(2)}`, color: 'green darken-2' },
                            { title: 'Cost', value: `$${data.cost.toFixed(2)}`, color: 'red darken-2' },
                            { title: 'Profit', value: `$${data.profit.toFixed(2)}`, color: 'teal darken-2' },
                            { title: 'ROI', value: `${data.roi.toFixed(1)}%`, color: 'orange darken-2' }
                        ];
                    })
                    .catch(err => console.error('Error loading summary:', err));
            },
            loadAggregatedReport() {
                this.loading = true;
                const dateFrom = this.dateRange[0];
                const dateTo = this.dateRange[1];

                this.loadSummary();

                fetch(`/backend/api/reports/aggregated?group_by=${this.groupBy}&date_from=${dateFrom}&date_to=${dateTo}`)
                    .then(res => res.json())
                    .then(data => {
                        this.aggregatedData = data;
                        this.loading = false;
                    })
                    .catch(err => {
                        console.error('Error loading aggregated report:', err);
                        this.$root.$emit('show-message', { type: 'error', text: err.message });
                        this.loading = false;
                    });
            },
            exportCSV() {
                const dateFrom = this.dateRange[0];
                const dateTo = this.dateRange[1];
                const url = `/backend/api/reports/export-csv?group_by=${this.groupBy}&date_from=${dateFrom}&date_to=${dateTo}`;
                window.open(url, '_blank');
            },
            reloadReports() {
                this.loadReports();
                this.$root.$emit('show-message', { type: 'success', text: 'Conversions reloaded successfully!' });
            },
            loadReports() {
                fetch('/backend/api/reports/')
                    .then(response => response.json())
                    .then(data => {
                        this.conversions = data;
                    })
                    .catch(err => {
                        console.error('Failed to load conversions:', err);
                        this.$root.$emit('show-message', { type: 'error', text: err.message });
                    });
            }
        }
    });
</script>
{% endraw %}
