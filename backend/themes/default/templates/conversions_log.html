{% raw %}
<script type="text/x-template" id="conversions-log-template">
    <v-container fluid>
        <h2>Conversions Log</h2>

        <!-- Stats Cards -->
        <v-row dense class="mt-4">
            <v-col cols="12" sm="6" md="2">
                <v-card class="pa-3" color="primary" dark>
                    <v-card-text class="text-center">
                        <div class="text-subtitle-2">Total</div>
                        <div class="text-h6 font-weight-bold">{{ total }}</div>
                    </v-card-text>
                </v-card>
            </v-col>
            <v-col cols="12" sm="6" md="2">
                <v-card class="pa-3" color="blue" dark>
                    <v-card-text class="text-center">
                        <div class="text-subtitle-2">Leads</div>
                        <div class="text-h6 font-weight-bold">{{ stats.leads }}</div>
                    </v-card-text>
                </v-card>
            </v-col>
            <v-col cols="12" sm="6" md="2">
                <v-card class="pa-3" color="green" dark>
                    <v-card-text class="text-center">
                        <div class="text-subtitle-2">Sales</div>
                        <div class="text-h6 font-weight-bold">{{ stats.sales }}</div>
                    </v-card-text>
                </v-card>
            </v-col>
            <v-col cols="12" sm="6" md="2">
                <v-card class="pa-3" color="red" dark>
                    <v-card-text class="text-center">
                        <div class="text-subtitle-2">Rejected</div>
                        <div class="text-h6 font-weight-bold">{{ stats.rejected }}</div>
                    </v-card-text>
                </v-card>
            </v-col>
            <v-col cols="12" sm="6" md="2">
                <v-card class="pa-3" color="orange" dark>
                    <v-card-text class="text-center">
                        <div class="text-subtitle-2">Hold</div>
                        <div class="text-h6 font-weight-bold">{{ stats.hold }}</div>
                    </v-card-text>
                </v-card>
            </v-col>
            <v-col cols="12" sm="6" md="2">
                <v-card class="pa-3" color="success" dark>
                    <v-card-text class="text-center">
                        <div class="text-subtitle-2">Revenue</div>
                        <div class="text-h6 font-weight-bold">${{ stats.revenue.toFixed(2) }}</div>
                    </v-card-text>
                </v-card>
            </v-col>
        </v-row>

        <!-- Filters -->
        <v-card class="mt-4 pa-4">
            <v-row dense align="center">
                <v-col cols="12" md="2">
                    <v-text-field
                        v-model="filters.click_id"
                        label="Click ID"
                        prepend-icon="mdi-identifier"
                        dense
                        outlined
                        clearable
                        @keyup.enter="loadData"
                    ></v-text-field>
                </v-col>
                <v-col cols="12" md="2">
                    <v-text-field
                        v-model="filters.campaign"
                        label="Campaign"
                        prepend-icon="mdi-bullhorn"
                        dense
                        outlined
                        clearable
                        @keyup.enter="loadData"
                    ></v-text-field>
                </v-col>
                <v-col cols="12" md="2">
                    <v-select
                        v-model="filters.status"
                        :items="statuses"
                        label="Status"
                        prepend-icon="mdi-tag"
                        dense
                        outlined
                        clearable
                    ></v-select>
                </v-col>
                <v-col cols="12" md="2">
                    <v-select
                        v-model="filters.country"
                        :items="countries"
                        label="Country"
                        prepend-icon="mdi-earth"
                        dense
                        outlined
                        clearable
                    ></v-select>
                </v-col>
                <v-col cols="12" md="2">
                    <v-menu
                        v-model="dateFromMenu"
                        :close-on-content-click="false"
                        transition="scale-transition"
                        offset-y
                        min-width="auto"
                    >
                        <template v-slot:activator="{ on, attrs }">
                            <v-text-field
                                v-model="filters.date_from"
                                label="Date From"
                                prepend-icon="mdi-calendar"
                                readonly
                                dense
                                outlined
                                clearable
                                v-bind="attrs"
                                v-on="on"
                            ></v-text-field>
                        </template>
                        <v-date-picker v-model="filters.date_from" @input="dateFromMenu = false"></v-date-picker>
                    </v-menu>
                </v-col>
                <v-col cols="12" md="2">
                    <v-menu
                        v-model="dateToMenu"
                        :close-on-content-click="false"
                        transition="scale-transition"
                        offset-y
                        min-width="auto"
                    >
                        <template v-slot:activator="{ on, attrs }">
                            <v-text-field
                                v-model="filters.date_to"
                                label="Date To"
                                prepend-icon="mdi-calendar"
                                readonly
                                dense
                                outlined
                                clearable
                                v-bind="attrs"
                                v-on="on"
                            ></v-text-field>
                        </template>
                        <v-date-picker v-model="filters.date_to" @input="dateToMenu = false"></v-date-picker>
                    </v-menu>
                </v-col>
            </v-row>
            <v-row dense>
                <v-col cols="12" class="text-right">
                    <v-btn color="primary" @click="loadData" :loading="loading">
                        <v-icon left>mdi-magnify</v-icon>
                        Search
                    </v-btn>
                    <v-btn text @click="resetFilters" class="ml-2">
                        <v-icon left>mdi-refresh</v-icon>
                        Reset
                    </v-btn>
                    <v-btn text color="success" @click="exportCSV" class="ml-2">
                        <v-icon left>mdi-download</v-icon>
                        Export CSV
                    </v-btn>
                </v-col>
            </v-row>
        </v-card>

        <!-- Status Quick Filters -->
        <v-card class="mt-4 pa-2">
            <v-chip-group v-model="quickStatus" @change="onQuickStatusChange">
                <v-chip filter outlined value="">All</v-chip>
                <v-chip filter outlined value="lead" color="blue">Leads</v-chip>
                <v-chip filter outlined value="sale" color="green">Sales</v-chip>
                <v-chip filter outlined value="upsale" color="teal">Upsales</v-chip>
                <v-chip filter outlined value="rejected" color="red">Rejected</v-chip>
                <v-chip filter outlined value="hold" color="orange">Hold</v-chip>
                <v-chip filter outlined value="trash" color="grey">Trash</v-chip>
            </v-chip-group>
        </v-card>

        <!-- Data Table -->
        <v-card class="mt-4">
            <v-data-table
                :headers="headers"
                :items="items"
                :loading="loading"
                :server-items-length="total"
                :options.sync="options"
                :footer-props="{ 'items-per-page-options': [25, 50, 100, 200] }"
                class="elevation-1"
                dense
                @update:options="onOptionsUpdate"
            >
                <!-- Click ID column - copyable -->
                <template v-slot:item.click_id="{ item }">
                    <v-tooltip bottom>
                        <template v-slot:activator="{ on, attrs }">
                            <span 
                                v-bind="attrs" 
                                v-on="on" 
                                style="cursor: pointer; font-family: monospace; font-size: 11px;"
                                @click="copyToClipboard(item.click_id)"
                            >
                                {{ item.click_id ? item.click_id.substring(0, 8) + '...' : '-' }}
                            </span>
                        </template>
                        <span>{{ item.click_id }}<br>Click to copy</span>
                    </v-tooltip>
                </template>

                <!-- Status with color -->
                <template v-slot:item.status="{ item }">
                    <v-chip 
                        :color="getStatusColor(item.status)" 
                        small 
                        dark
                    >
                        {{ item.status }}
                    </v-chip>
                </template>

                <!-- Payout formatted -->
                <template v-slot:item.payout="{ item }">
                    <span v-if="item.payout" class="green--text font-weight-bold">
                        ${{ parseFloat(item.payout).toFixed(2) }}
                    </span>
                    <span v-else>$0.00</span>
                </template>

                <!-- Conversion time -->
                <template v-slot:item.conversion_time="{ item }">
                    <span v-if="item.conversion_time" class="text-caption">
                        {{ formatDuration(item.conversion_time) }}
                    </span>
                    <span v-else>-</span>
                </template>

                <!-- IP -->
                <template v-slot:item.ip="{ item }">
                    <span style="font-family: monospace; font-size: 11px;">{{ item.ip || '-' }}</span>
                </template>

                <!-- Date formatted -->
                <template v-slot:item.received_at="{ item }">
                    {{ formatDate(item.received_at) }}
                </template>

                <!-- Postback date -->
                <template v-slot:item.postback_at="{ item }">
                    {{ formatDate(item.postback_at) }}
                </template>
            </v-data-table>
        </v-card>

        <!-- Snackbar -->
        <v-snackbar v-model="snackbar.show" :color="snackbar.color" timeout="2000">
            {{ snackbar.text }}
        </v-snackbar>
    </v-container>
</script>

<script type="application/javascript">
Vue.component('conversions-log-component', {
    template: '#conversions-log-template',
    data() {
        return {
            loading: false,
            items: [],
            total: 0,
            stats: {
                leads: 0,
                sales: 0,
                rejected: 0,
                hold: 0,
                revenue: 0
            },
            filters: {
                click_id: '',
                campaign: '',
                status: '',
                country: '',
                date_from: null,
                date_to: null
            },
            quickStatus: '',
            dateFromMenu: false,
            dateToMenu: false,
            countries: [],
            statuses: [
                { text: 'Lead', value: 'lead' },
                { text: 'Sale', value: 'sale' },
                { text: 'Upsale', value: 'upsale' },
                { text: 'Rejected', value: 'rejected' },
                { text: 'Hold', value: 'hold' },
                { text: 'Trash', value: 'trash' }
            ],
            options: {
                page: 1,
                itemsPerPage: 50,
                sortBy: [],
                sortDesc: []
            },
            headers: [
                { text: 'ID', value: 'id', width: 70 },
                { text: 'Click ID', value: 'click_id', width: 120 },
                { text: 'Status', value: 'status', width: 100 },
                { text: 'Payout', value: 'payout', width: 90 },
                { text: 'Campaign', value: 'campaign_name', width: 150 },
                { text: 'Offer', value: 'offer_name', width: 150 },
                { text: 'Country', value: 'country', width: 80 },
                { text: 'IP', value: 'ip', width: 120 },
                { text: 'Sub ID 1', value: 'sub_id_1', width: 100 },
                { text: 'Sub ID 2', value: 'sub_id_2', width: 100 },
                { text: 'Click Time', value: 'received_at', width: 160 },
                { text: 'Conv Time', value: 'postback_at', width: 160 }
            ],
            snackbar: {
                show: false,
                text: '',
                color: 'success'
            }
        };
    },
    mounted() {
        this.$root.$on('load-conversions-log', this.loadData);
        this.loadFilterOptions();
        this.loadData();
    },
    methods: {
        async loadData() {
            this.loading = true;
            try {
                const params = new URLSearchParams();
                if (this.filters.click_id) params.append('click_id', this.filters.click_id);
                if (this.filters.campaign) params.append('campaign', this.filters.campaign);
                if (this.filters.status) params.append('status', this.filters.status);
                if (this.filters.country) params.append('country', this.filters.country);
                if (this.filters.date_from) params.append('date_from', this.filters.date_from);
                if (this.filters.date_to) params.append('date_to', this.filters.date_to);
                params.append('limit', this.options.itemsPerPage);
                params.append('offset', (this.options.page - 1) * this.options.itemsPerPage);

                const response = await fetch(`/backend/api/reports/conversions-log?${params}`);
                const data = await response.json();
                this.items = data.items;
                this.total = data.total;
                
                // Calculate stats from response or make separate call
                this.calculateStats(data.items);
            } catch (error) {
                console.error('Error loading conversions:', error);
            } finally {
                this.loading = false;
            }
        },
        async loadFilterOptions() {
            try {
                const response = await fetch('/backend/api/reports/filter-options');
                const data = await response.json();
                this.countries = data.countries;
            } catch (error) {
                console.error('Error loading filter options:', error);
            }
        },
        calculateStats(items) {
            // Basic calculation - in production this should come from backend aggregation
            this.stats = {
                leads: items.filter(i => i.status === 'lead').length,
                sales: items.filter(i => i.status === 'sale' || i.status === 'upsale').length,
                rejected: items.filter(i => i.status === 'rejected').length,
                hold: items.filter(i => i.status === 'hold').length,
                revenue: items.reduce((sum, i) => sum + (parseFloat(i.payout) || 0), 0)
            };
        },
        onOptionsUpdate() {
            this.loadData();
        },
        onQuickStatusChange() {
            this.filters.status = this.quickStatus;
            this.loadData();
        },
        resetFilters() {
            this.filters = {
                click_id: '',
                campaign: '',
                status: '',
                country: '',
                date_from: null,
                date_to: null
            };
            this.quickStatus = '';
            this.loadData();
        },
        formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleString();
        },
        formatDuration(seconds) {
            if (!seconds) return '-';
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            if (mins > 60) {
                const hrs = Math.floor(mins / 60);
                return `${hrs}h ${mins % 60}m`;
            }
            return mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
        },
        getStatusColor(status) {
            const colors = {
                'lead': 'blue',
                'sale': 'green',
                'upsale': 'teal',
                'rejected': 'red',
                'hold': 'orange',
                'trash': 'grey'
            };
            return colors[status] || 'grey';
        },
        copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            this.snackbar = { show: true, text: 'Copied!', color: 'success' };
        },
        async exportCSV() {
            this.loading = true;
            try {
                const params = new URLSearchParams();
                if (this.filters.click_id) params.append('click_id', this.filters.click_id);
                if (this.filters.campaign) params.append('campaign', this.filters.campaign);
                if (this.filters.status) params.append('status', this.filters.status);
                if (this.filters.country) params.append('country', this.filters.country);
                if (this.filters.date_from) params.append('date_from', this.filters.date_from);
                if (this.filters.date_to) params.append('date_to', this.filters.date_to);
                params.append('limit', 10000);
                params.append('offset', 0);

                const response = await fetch(`/backend/api/reports/conversions-log?${params}`);
                const data = await response.json();
                
                // Convert to CSV
                const headers = this.headers.map(h => h.value);
                const headerLabels = this.headers.map(h => h.text);
                let csv = headerLabels.join(',') + '\n';
                
                data.items.forEach(item => {
                    const row = headers.map(h => {
                        const val = item[h];
                        if (val === null || val === undefined) return '';
                        return `"${String(val).replace(/"/g, '""')}"`;
                    });
                    csv += row.join(',') + '\n';
                });
                
                // Download
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `conversions_log_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
                window.URL.revokeObjectURL(url);
                
                this.snackbar = { show: true, text: 'Export completed!', color: 'success' };
            } catch (error) {
                console.error('Error exporting:', error);
                this.snackbar = { show: true, text: 'Export failed', color: 'error' };
            } finally {
                this.loading = false;
            }
        }
    }
});
</script>
{% endraw %}
