{% raw %}
<script type="text/x-template" id="clicks-log-template">
    <v-container fluid>
        <h2>Clicks Log</h2>

        <!-- Stats Cards -->
        <v-row dense class="mt-4">
            <v-col cols="12" sm="6" md="3">
                <v-card class="pa-3" color="primary" dark>
                    <v-card-text class="text-center">
                        <div class="text-subtitle-1">Total Clicks</div>
                        <div class="text-h5 font-weight-bold mt-1">{{ total }}</div>
                    </v-card-text>
                </v-card>
            </v-col>
        </v-row>

        <!-- Filters -->
        <v-card class="mt-4 pa-4">
            <v-row dense align="center">
                <v-col cols="12" md="3">
                    <v-text-field
                        v-model="filters.click_id"
                        label="Click ID"
                        prepend-icon="mdi-identifier"
                        dense
                        outlined
                        clearable
                        @keyup.enter="loadData"
                    ></v-text-field>
                </v-col>
                <v-col cols="12" md="3">
                    <v-text-field
                        v-model="filters.campaign"
                        label="Campaign"
                        prepend-icon="mdi-bullhorn"
                        dense
                        outlined
                        clearable
                        @keyup.enter="loadData"
                    ></v-text-field>
                </v-col>
                <v-col cols="12" md="2">
                    <v-select
                        v-model="filters.country"
                        :items="countries"
                        label="Country"
                        prepend-icon="mdi-earth"
                        dense
                        outlined
                        clearable
                    ></v-select>
                </v-col>
                <v-col cols="12" md="2">
                    <v-menu
                        v-model="dateFromMenu"
                        :close-on-content-click="false"
                        transition="scale-transition"
                        offset-y
                        min-width="auto"
                    >
                        <template v-slot:activator="{ on, attrs }">
                            <v-text-field
                                v-model="filters.date_from"
                                label="Date From"
                                prepend-icon="mdi-calendar"
                                readonly
                                dense
                                outlined
                                clearable
                                v-bind="attrs"
                                v-on="on"
                            ></v-text-field>
                        </template>
                        <v-date-picker v-model="filters.date_from" @input="dateFromMenu = false"></v-date-picker>
                    </v-menu>
                </v-col>
                <v-col cols="12" md="2">
                    <v-menu
                        v-model="dateToMenu"
                        :close-on-content-click="false"
                        transition="scale-transition"
                        offset-y
                        min-width="auto"
                    >
                        <template v-slot:activator="{ on, attrs }">
                            <v-text-field
                                v-model="filters.date_to"
                                label="Date To"
                                prepend-icon="mdi-calendar"
                                readonly
                                dense
                                outlined
                                clearable
                                v-bind="attrs"
                                v-on="on"
                            ></v-text-field>
                        </template>
                        <v-date-picker v-model="filters.date_to" @input="dateToMenu = false"></v-date-picker>
                    </v-menu>
                </v-col>
            </v-row>
            <v-row dense>
                <v-col cols="12" class="text-right">
                    <v-btn color="primary" @click="loadData" :loading="loading">
                        <v-icon left>mdi-magnify</v-icon>
                        Search
                    </v-btn>
                    <v-btn text @click="resetFilters" class="ml-2">
                        <v-icon left>mdi-refresh</v-icon>
                        Reset
                    </v-btn>
                    <v-btn text color="success" @click="exportCSV" class="ml-2">
                        <v-icon left>mdi-download</v-icon>
                        Export CSV
                    </v-btn>
                </v-col>
            </v-row>
        </v-card>

        <!-- Column Selector -->
        <v-card class="mt-4 pa-2">
            <v-btn text small @click="showColumnsDialog = true">
                <v-icon left small>mdi-view-column</v-icon>
                Columns ({{ visibleColumns.length }}/{{ allColumns.length }})
            </v-btn>
        </v-card>

        <!-- Data Table -->
        <v-card class="mt-4">
            <v-data-table
                :headers="tableHeaders"
                :items="items"
                :loading="loading"
                :server-items-length="total"
                :options.sync="options"
                :footer-props="{ 'items-per-page-options': [25, 50, 100, 200] }"
                class="elevation-1"
                dense
                @update:options="onOptionsUpdate"
            >
                <!-- Click ID column - copyable -->
                <template v-slot:item.click_id="{ item }">
                    <v-tooltip bottom>
                        <template v-slot:activator="{ on, attrs }">
                            <span 
                                v-bind="attrs" 
                                v-on="on" 
                                style="cursor: pointer; font-family: monospace; font-size: 11px;"
                                @click="copyToClipboard(item.click_id)"
                            >
                                {{ item.click_id ? item.click_id.substring(0, 8) + '...' : '-' }}
                            </span>
                        </template>
                        <span>{{ item.click_id }}<br>Click to copy</span>
                    </v-tooltip>
                </template>

                <!-- Status with color -->
                <template v-slot:item.status="{ item }">
                    <v-chip 
                        v-if="item.status" 
                        :color="getStatusColor(item.status)" 
                        small 
                        dark
                    >
                        {{ item.status }}
                    </v-chip>
                    <span v-else class="grey--text">-</span>
                </template>

                <!-- Country with flag -->
                <template v-slot:item.country="{ item }">
                    <span v-if="item.country">
                        {{ item.country }}
                    </span>
                    <span v-else class="grey--text">-</span>
                </template>

                <!-- Payout formatted -->
                <template v-slot:item.payout="{ item }">
                    <span v-if="item.payout" class="green--text font-weight-medium">
                        ${{ parseFloat(item.payout).toFixed(2) }}
                    </span>
                    <span v-else>-</span>
                </template>

                <!-- IP -->
                <template v-slot:item.ip="{ item }">
                    <span style="font-family: monospace; font-size: 11px;">{{ item.ip || '-' }}</span>
                </template>

                <!-- Date formatted -->
                <template v-slot:item.received_at="{ item }">
                    {{ formatDate(item.received_at) }}
                </template>

                <!-- Bot indicator -->
                <template v-slot:item.is_bot="{ item }">
                    <v-icon v-if="item.is_bot" color="error" small>mdi-robot</v-icon>
                    <span v-else>-</span>
                </template>

                <!-- Proxy indicator -->
                <template v-slot:item.is_using_proxy="{ item }">
                    <v-icon v-if="item.is_using_proxy" color="warning" small>mdi-vpn</v-icon>
                    <span v-else>-</span>
                </template>
            </v-data-table>
        </v-card>

        <!-- Columns Dialog -->
        <v-dialog v-model="showColumnsDialog" max-width="500">
            <v-card>
                <v-card-title>Select Columns</v-card-title>
                <v-card-text>
                    <v-checkbox
                        v-for="col in allColumns"
                        :key="col.value"
                        v-model="visibleColumns"
                        :label="col.text"
                        :value="col.value"
                        dense
                        hide-details
                    ></v-checkbox>
                </v-card-text>
                <v-card-actions>
                    <v-spacer></v-spacer>
                    <v-btn text @click="selectAllColumns">Select All</v-btn>
                    <v-btn color="primary" @click="showColumnsDialog = false">OK</v-btn>
                </v-card-actions>
            </v-card>
        </v-dialog>

        <!-- Snackbar -->
        <v-snackbar v-model="snackbar.show" :color="snackbar.color" timeout="2000">
            {{ snackbar.text }}
        </v-snackbar>
    </v-container>
</script>

<script type="application/javascript">
Vue.component('clicks-log-component', {
    template: '#clicks-log-template',
    data() {
        return {
            loading: false,
            items: [],
            total: 0,
            filters: {
                click_id: '',
                campaign: '',
                country: '',
                date_from: null,
                date_to: null
            },
            dateFromMenu: false,
            dateToMenu: false,
            countries: [],
            options: {
                page: 1,
                itemsPerPage: 50,
                sortBy: [],
                sortDesc: []
            },
            showColumnsDialog: false,
            allColumns: [
                { text: 'ID', value: 'id' },
                { text: 'Click ID', value: 'click_id' },
                { text: 'Campaign', value: 'campaign_name' },
                { text: 'Offer', value: 'offer_name' },
                { text: 'Country', value: 'country' },
                { text: 'Region', value: 'region' },
                { text: 'City', value: 'city' },
                { text: 'IP', value: 'ip' },
                { text: 'Visitor ID', value: 'visitor_id' },
                { text: 'OS', value: 'os' },
                { text: 'Device', value: 'device_type' },
                { text: 'Bot', value: 'is_bot' },
                { text: 'Proxy', value: 'is_using_proxy' },
                { text: 'Status', value: 'status' },
                { text: 'Payout', value: 'payout' },
                { text: 'Sub ID 1', value: 'sub_id_1' },
                { text: 'Sub ID 2', value: 'sub_id_2' },
                { text: 'Sub ID 3', value: 'sub_id_3' },
                { text: 'UTM Source', value: 'utm_source' },
                { text: 'UTM Campaign', value: 'utm_campaign' },
                { text: 'Date', value: 'received_at' }
            ],
            visibleColumns: ['id', 'click_id', 'campaign_name', 'country', 'ip', 'status', 'payout', 'received_at'],
            snackbar: {
                show: false,
                text: '',
                color: 'success'
            }
        };
    },
    computed: {
        tableHeaders() {
            return this.allColumns.filter(col => this.visibleColumns.includes(col.value));
        }
    },
    mounted() {
        this.$root.$on('load-clicks-log', this.loadData);
        this.loadFilterOptions();
        this.loadData();
    },
    methods: {
        async loadData() {
            this.loading = true;
            try {
                const params = new URLSearchParams();
                if (this.filters.click_id) params.append('click_id', this.filters.click_id);
                if (this.filters.campaign) params.append('campaign', this.filters.campaign);
                if (this.filters.country) params.append('country', this.filters.country);
                if (this.filters.date_from) params.append('date_from', this.filters.date_from);
                if (this.filters.date_to) params.append('date_to', this.filters.date_to);
                params.append('limit', this.options.itemsPerPage);
                params.append('offset', (this.options.page - 1) * this.options.itemsPerPage);

                const response = await fetch(`/backend/api/reports/clicks-log-full?${params}`);
                const data = await response.json();
                this.items = data.items;
                this.total = data.total;
            } catch (error) {
                console.error('Error loading clicks:', error);
            } finally {
                this.loading = false;
            }
        },
        async loadFilterOptions() {
            try {
                const response = await fetch('/backend/api/reports/filter-options');
                const data = await response.json();
                this.countries = data.countries;
            } catch (error) {
                console.error('Error loading filter options:', error);
            }
        },
        onOptionsUpdate() {
            this.loadData();
        },
        resetFilters() {
            this.filters = {
                click_id: '',
                campaign: '',
                country: '',
                date_from: null,
                date_to: null
            };
            this.loadData();
        },
        formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleString();
        },
        getStatusColor(status) {
            const colors = {
                'lead': 'blue',
                'sale': 'green',
                'upsale': 'teal',
                'rejected': 'red',
                'hold': 'orange',
                'trash': 'grey'
            };
            return colors[status] || 'grey';
        },
        copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            this.snackbar = { show: true, text: 'Copied!', color: 'success' };
        },
        selectAllColumns() {
            this.visibleColumns = this.allColumns.map(c => c.value);
        },
        async exportCSV() {
            this.loading = true;
            try {
                const params = new URLSearchParams();
                if (this.filters.click_id) params.append('click_id', this.filters.click_id);
                if (this.filters.campaign) params.append('campaign', this.filters.campaign);
                if (this.filters.country) params.append('country', this.filters.country);
                if (this.filters.date_from) params.append('date_from', this.filters.date_from);
                if (this.filters.date_to) params.append('date_to', this.filters.date_to);
                params.append('limit', 10000);
                params.append('offset', 0);

                const response = await fetch(`/backend/api/reports/clicks-log-full?${params}`);
                const data = await response.json();
                
                // Convert to CSV
                const headers = this.visibleColumns;
                const headerLabels = this.tableHeaders.map(h => h.text);
                let csv = headerLabels.join(',') + '\n';
                
                data.items.forEach(item => {
                    const row = headers.map(h => {
                        const val = item[h];
                        if (val === null || val === undefined) return '';
                        return `"${String(val).replace(/"/g, '""')}"`;
                    });
                    csv += row.join(',') + '\n';
                });
                
                // Download
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `clicks_log_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
                window.URL.revokeObjectURL(url);
                
                this.snackbar = { show: true, text: 'Export completed!', color: 'success' };
            } catch (error) {
                console.error('Error exporting:', error);
                this.snackbar = { show: true, text: 'Export failed', color: 'error' };
            } finally {
                this.loading = false;
            }
        }
    }
});
</script>
{% endraw %}
